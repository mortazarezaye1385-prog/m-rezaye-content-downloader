services:
 backend:
    build: ./backend
    env_file: ./backend/.env
      ports:
    - "8000:8000"
    tmpfs:
      - /tmp/mr-content-downloader:size=4g,mode=1777
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        BACKEND_SERVICE: http://backend:8000
    environment:
     BACKEND_SERVICE: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
   depends_on: [backend]
    restart: unless-stopped
